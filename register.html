{% extends "base.html" %}
{% block title %}Register - Disease Risk Prediction System{% endblock %}
{% block content %}
<section class="auth-page">
    <div class="auth-card">
        <div class="auth-icon">+</div>
        <span class="eyebrow">CREATE ACCOUNT</span>
        <h1>Get started</h1>
        <p>Create your account to access predictions and history.</p>
        <form method="post">
            <label>Full Name<input name="name" required></label>
            <label>Email<input type="email" name="email" required></label>
            <label>Password<input type="password" name="password" required minlength="6"></label>
            <button class="btn btn-primary full" type="submit">Create Account</button>
        </form>
        <p class="auth-footer">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
    </div>
</section>
{% endblock %}
