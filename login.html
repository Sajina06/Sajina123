{% extends "base.html" %}
{% block title %}Login - Disease Risk Prediction System{% endblock %}
{% block content %}
<section class="auth-page">
    <div class="auth-card">
        <div class="auth-icon">♥</div>
        <span class="eyebrow">WELCOME BACK</span>
        <h1>Login to your account</h1>
        <p>After login, your dashboard will open with the sidebar layout and dark mode.</p>
        <form method="post">
            <label>Email<input type="email" name="email" required placeholder="you@example.com"></label>
            <label>Password<input type="password" name="password" required placeholder="••••••••"></label>
            <button class="btn btn-primary full" type="submit">Login</button>
        </form>
        <p class="auth-footer">Don't have an account? <a href="{{ url_for('register') }}">Create one</a></p>
    </div>
</section>
{% endblock %}
